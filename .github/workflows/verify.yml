name: Verify Godot game
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned stable engine and templates
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .godot-version | tr -d '\r\n')"
          base="https://github.com/godotengine/godot-builds/releases/download/${version}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${version}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${version}-stable_linux.x86_64"
          echo "GODOT_EXECUTABLE=/tmp/godot/Godot_v${version}-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 "$base/Godot_v${version}-stable_export_templates.tpz" -o /tmp/templates.zip
          mkdir -p "$HOME/.local/share/godot/export_templates/${version}.stable"
          unzip -j -q /tmp/templates.zip 'templates/web_nothreads_release.zip' 'templates/windows_release_x86_64.exe' -d "$HOME/.local/share/godot/export_templates/${version}.stable"
      - name: Run algorithm, mission, persistence and UI checks; export both targets
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: misplaced-mail-builds
          path: export/
          retention-days: 14
